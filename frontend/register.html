<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - AgriWatch</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-bg">
        <div class="gradient-overlay"></div>
        
        <!-- Floating Elements -->
        <div class="floating-elements">
            <div class="floating-leaf leaf-1">🌿</div>
            <div class="floating-leaf leaf-2">🌾</div>
            <div class="floating-leaf leaf-3">🍃</div>
            <div class="floating-leaf leaf-4">🌱</div>
            <div class="floating-leaf leaf-5">🌿</div>
            <div class="floating-leaf leaf-6">🍀</div>
            <div class="floating-leaf leaf-7">🌾</div>
            <div class="floating-leaf leaf-8">🌿</div>
        </div>
        
        <!-- Animated Waves -->
        <div class="waves">
            <svg class="wave wave-1" viewBox="0 0 1440 320" preserveAspectRatio="none">
                <path fill="rgba(16, 185, 129, 0.1)" d="M0,160L48,176C96,192,192,224,288,213.3C384,203,480,149,576,133.3C672,117,768,139,864,165.3C960,192,1056,224,1152,218.7C1248,213,1344,171,1392,149.3L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
            </svg>
            <svg class="wave wave-2" viewBox="0 0 1440 320" preserveAspectRatio="none">
                <path fill="rgba(59, 130, 246, 0.08)" d="M0,64L48,96C96,128,192,192,288,202.7C384,213,480,171,576,144C672,117,768,107,864,122.7C960,139,1056,181,1152,181.3C1248,181,1344,139,1392,117.3L1440,96L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
            </svg>
        </div>
        
        <!-- Particle dots -->
        <div class="particles">
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
        </div>
    </div>

    <!-- Main Content -->
    <div class="auth-container">
        <!-- Left Side - Branding -->
        <div class="auth-branding">
            <div class="brand-content">
                <div class="logo-wrapper">
                    <div class="logo-icon">🌾</div>
                    <div class="logo-glow"></div>
                </div>
                <h1 class="brand-title">AgriWatch</h1>
                <p class="brand-subtitle">Tarımsal Kuraklık Takip Sistemi</p>
                
                <div class="features-list">
                    <div class="feature-item">
                        <span class="feature-icon">🆓</span>
                        <span class="feature-text">Ücretsiz başlayın, 3 tarla takip edin</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">🛰️</span>
                        <span class="feature-text">Uydu ile gerçek zamanlı izleme</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">📊</span>
                        <span class="feature-text">Yapay zeka destekli analiz</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">📈</span>
                        <span class="feature-text">Detaylı raporlama</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side - Register Form -->
        <div class="auth-form-container">
            <div class="auth-card">
                <div class="auth-header">
                    <h2>Hesap Oluştur</h2>
                    <p>Ücretsiz kayıt olun ve başlayın</p>
                </div>

                <form id="register-form" class="auth-form">
                    <div class="form-group">
                        <label for="username">Kullanıcı Adı</label>
                        <div class="input-wrapper">
                            <span class="input-icon">👤</span>
                            <input type="text" id="username" name="username" placeholder="kullanici_adi" required minlength="3">
                            <span class="input-focus-effect"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">E-posta Adresi</label>
                        <div class="input-wrapper">
                            <span class="input-icon">📧</span>
                            <input type="email" id="email" name="email" placeholder="ornek@email.com" required>
                            <span class="input-focus-effect"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Şifre</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6" oninput="checkPasswordStrength()">
                            <button type="button" class="toggle-password" onclick="togglePassword('password')">👁️</button>
                            <span class="input-focus-effect"></span>
                        </div>
                        <div class="password-strength">
                            <div class="password-strength-bar" id="strength-bar"></div>
                        </div>
                        <p class="password-hint" id="password-hint">En az 6 karakter</p>
                    </div>

                    <div class="form-group">
                        <label for="password-confirm">Şifre Tekrar</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔐</span>
                            <input type="password" id="password-confirm" name="password-confirm" placeholder="••••••••" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('password-confirm')">👁️</button>
                            <span class="input-focus-effect"></span>
                        </div>
                    </div>

                    <div class="terms-checkbox">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">
                            <a href="#">Kullanım Şartları</a> ve <a href="#">Gizlilik Politikası</a>'nı kabul ediyorum
                        </label>
                    </div>

                    <button type="submit" class="btn-submit" id="btn-register">
                        <span class="btn-text">Kayıt Ol</span>
                        <span class="btn-loader"></span>
                    </button>

                    <div class="error-message" id="error-message"></div>
                    <div class="success-message" id="success-message"></div>
                </form>

                <div class="auth-footer">
                    <p>Zaten hesabınız var mı? <a href="login.html">Giriş Yapın</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Toggle password visibility
        function togglePassword(fieldId) {
            const pwd = document.getElementById(fieldId);
            const btn = pwd.parentElement.querySelector('.toggle-password');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                btn.textContent = '🙈';
            } else {
                pwd.type = 'password';
                btn.textContent = '👁️';
            }
        }

        // Check password strength
        function checkPasswordStrength() {
            const password = document.getElementById('password').value;
            const bar = document.getElementById('strength-bar');
            const hint = document.getElementById('password-hint');
            
            bar.className = 'password-strength-bar';
            
            if (password.length < 6) {
                bar.style.width = '20%';
                bar.style.background = '#ef4444';
                hint.textContent = 'Çok kısa';
                hint.style.color = '#ef4444';
            } else if (password.length < 8) {
                bar.classList.add('weak');
                hint.textContent = 'Zayıf şifre';
                hint.style.color = '#ef4444';
            } else if (password.length < 10 || !/[A-Z]/.test(password) || !/[0-9]/.test(password)) {
                bar.classList.add('medium');
                hint.textContent = 'Orta güçlükte';
                hint.style.color = '#f59e0b';
            } else {
                bar.classList.add('strong');
                hint.textContent = 'Güçlü şifre ✓';
                hint.style.color = '#10b981';
            }
        }

        // Form submit
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('btn-register');
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
            
            btn.classList.add('loading');
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password-confirm').value;
            
            // Validation
            if (password !== passwordConfirm) {
                btn.classList.remove('loading');
                errorDiv.textContent = 'Şifreler eşleşmiyor!';
                errorDiv.classList.add('show');
                return;
            }
            
            if (password.length < 6) {
                btn.classList.remove('loading');
                errorDiv.textContent = 'Şifre en az 6 karakter olmalı!';
                errorDiv.classList.add('show');
                return;
            }
            
            try {
                const response = await fetch('http://localhost:5000/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Success!
                    btn.classList.remove('loading');
                    btn.classList.add('success');
                    btn.querySelector('.btn-text').textContent = '✓ Kayıt Başarılı!';
                    
                    successDiv.textContent = 'Hesabınız oluşturuldu! Giriş sayfasına yönlendiriliyorsunuz...';
                    successDiv.classList.add('show');
                    
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    throw new Error(data.error || 'Kayıt başarısız');
                }
            } catch (error) {
                btn.classList.remove('loading');
                errorDiv.textContent = error.message === 'Failed to fetch' 
                    ? 'Sunucuya bağlanılamıyor! Backend çalışıyor mu?' 
                    : error.message;
                errorDiv.classList.add('show');
                
                // Shake animation
                document.querySelector('.auth-card').classList.add('shake');
                setTimeout(() => {
                    document.querySelector('.auth-card').classList.remove('shake');
                }, 500);
            }
        });

        // Check if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = 'index.html';
        }

        // Add floating animation delays
        document.querySelectorAll('.floating-leaf').forEach((leaf, index) => {
            leaf.style.animationDelay = `${index * 0.7}s`;
        });

        document.querySelectorAll('.particle').forEach((particle, index) => {
            particle.style.animationDelay = `${index * 0.5}s`;
            particle.style.left = `${Math.random() * 100}%`;
        });
    </script>
    
    <style>
        .success-message {
            padding: 0.875rem;
            background: #f0fdf4;
            border: 1px solid #86efac;
            border-radius: 10px;
            color: #16a34a;
            font-size: 0.875rem;
            text-align: center;
            display: none;
            margin-top: 1rem;
        }
        
        .success-message.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        .terms-checkbox {
            margin-top: 0.5rem;
        }
        
        .terms-checkbox input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .terms-checkbox label {
            cursor: pointer;
            line-height: 1.4;
        }
    </style>
</body>
</html>
