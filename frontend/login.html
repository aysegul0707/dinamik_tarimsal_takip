<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - AgriWatch</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-bg">
        <div class="gradient-overlay"></div>
        
        <!-- Floating Elements -->
        <div class="floating-elements">
            <div class="floating-leaf leaf-1">🌿</div>
            <div class="floating-leaf leaf-2">🌾</div>
            <div class="floating-leaf leaf-3">🍃</div>
            <div class="floating-leaf leaf-4">🌱</div>
            <div class="floating-leaf leaf-5">🌿</div>
            <div class="floating-leaf leaf-6">🍀</div>
            <div class="floating-leaf leaf-7">🌾</div>
            <div class="floating-leaf leaf-8">🌿</div>
        </div>
        
        <!-- Animated Waves -->
        <div class="waves">
            <svg class="wave wave-1" viewBox="0 0 1440 320" preserveAspectRatio="none">
                <path fill="rgba(16, 185, 129, 0.1)" d="M0,160L48,176C96,192,192,224,288,213.3C384,203,480,149,576,133.3C672,117,768,139,864,165.3C960,192,1056,224,1152,218.7C1248,213,1344,171,1392,149.3L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
            </svg>
            <svg class="wave wave-2" viewBox="0 0 1440 320" preserveAspectRatio="none">
                <path fill="rgba(59, 130, 246, 0.08)" d="M0,64L48,96C96,128,192,192,288,202.7C384,213,480,171,576,144C672,117,768,107,864,122.7C960,139,1056,181,1152,181.3C1248,181,1344,139,1392,117.3L1440,96L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
            </svg>
        </div>
        
        <!-- Particle dots -->
        <div class="particles">
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
        </div>
    </div>

    <!-- Main Content -->
    <div class="auth-container">
        <!-- Left Side - Branding -->
        <div class="auth-branding">
            <div class="brand-content">
                <div class="logo-wrapper">
                    <div class="logo-icon">🌾</div>
                    <div class="logo-glow"></div>
                </div>
                <h1 class="brand-title">AgriWatch</h1>
                <p class="brand-subtitle">Tarımsal Kuraklık Takip Sistemi</p>
                
                <div class="features-list">
                    <div class="feature-item">
                        <span class="feature-icon">🛰️</span>
                        <span class="feature-text">Uydu ile gerçek zamanlı izleme</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">📊</span>
                        <span class="feature-text">Yapay zeka destekli analiz</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">⚡</span>
                        <span class="feature-text">Erken uyarı sistemi</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">📈</span>
                        <span class="feature-text">Detaylı raporlama</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side - Login Form -->
        <div class="auth-form-container">
            <div class="auth-card">
                <div class="auth-header">
                    <h2>Hoş Geldiniz</h2>
                    <p>Hesabınıza giriş yapın</p>
                </div>

                <form id="login-form" class="auth-form">
                    <div class="form-group">
                        <label for="username">Kullanıcı Adı</label>
                        <div class="input-wrapper">
                            <span class="input-icon">👤</span>
                            <input type="text" id="username" name="username" placeholder="Kullanıcı adınız" required>
                            <span class="input-focus-effect"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Şifre</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="password" name="password" placeholder="••••••••" required>
                            <button type="button" class="toggle-password" onclick="togglePassword()">👁️</button>
                            <span class="input-focus-effect"></span>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="remember">
                            <span class="checkmark"></span>
                            <span>Beni hatırla</span>
                        </label>
                        <a href="forgot-password.html" class="forgot-link">Şifremi unuttum</a>
                    </div>

                    <button type="submit" class="btn-submit" id="btn-login">
                        <span class="btn-text">Giriş Yap</span>
                        <span class="btn-loader"></span>
                    </button>

                    <div class="error-message" id="error-message"></div>
                </form>

                <div class="auth-footer">
                    <p>Hesabınız yok mu? <a href="register.html">Kayıt Olun</a></p>
                </div>

                <div class="auth-divider">
                    <span>veya</span>
                </div>

                <div class="demo-login">
                    <button type="button" class="btn-demo" onclick="demoLogin()">
                        <span>🚀</span> Demo ile Giriş Yap
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // Toggle password visibility
        function togglePassword() {
            const pwd = document.getElementById('password');
            const btn = document.querySelector('.toggle-password');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                btn.textContent = '🙈';
            } else {
                pwd.type = 'password';
                btn.textContent = '👁️';
            }
        }

        // Form submit
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('btn-login');
            const errorDiv = document.getElementById('error-message');
            
            btn.classList.add('loading');
            errorDiv.textContent = '';
            errorDiv.classList.remove('show');
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Success! Save token and redirect
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    // Show success animation
                    btn.classList.remove('loading');
                    btn.classList.add('success');
                    btn.querySelector('.btn-text').textContent = '✓ Başarılı!';
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    throw new Error(data.error || 'Giriş başarısız');
                }
            } catch (error) {
                btn.classList.remove('loading');
                errorDiv.textContent = error.message === 'Failed to fetch' 
                    ? 'Sunucuya bağlanılamıyor! Backend çalışıyor mu?' 
                    : error.message;
                errorDiv.classList.add('show');
                
                // Shake animation
                document.querySelector('.auth-card').classList.add('shake');
                setTimeout(() => {
                    document.querySelector('.auth-card').classList.remove('shake');
                }, 500);
            }
        });

        // Demo login - hızlı giriş (backend olmadan)
        function demoLogin() {
            const demoToken = 'demo_token_' + Date.now();
            const demoUser = {
                id: 1,
                username: 'demo',
                email: 'demo@agriwatch.com',
                subscription_type: 'free'
            };
            
            localStorage.setItem('token', demoToken);
            localStorage.setItem('user', JSON.stringify(demoUser));
            
            // Animate and redirect
            const btn = document.querySelector('.btn-demo');
            btn.textContent = '✓ Giriş yapılıyor...';
            
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 500);
        }

        // Check if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = 'dashboard.html';
        }

        // Add floating animation delays
        document.querySelectorAll('.floating-leaf').forEach((leaf, index) => {
            leaf.style.animationDelay = `${index * 0.7}s`;
        });

        document.querySelectorAll('.particle').forEach((particle, index) => {
            particle.style.animationDelay = `${index * 0.5}s`;
            particle.style.left = `${Math.random() * 100}%`;
        });
    </script>
</body>
</html>
